<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Input Nota Kulakan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-12 font-sans text-slate-800">

  <!-- Header -->
  <header class="bg-indigo-700 text-white py-4 px-6 shadow-md no-print mb-6">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-receipt"></i> Form Nota Kulakan & HPP
      </h1>
      <span class="text-xs bg-indigo-800 px-3 py-1 rounded-full text-indigo-200">Google Sheet Integration</span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4">
    
    <!-- Config Google Apps Script -->
    <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-6 shadow-sm no-print">
      <label class="block text-xs font-bold text-amber-800 mb-1">
        <i class="fa-solid fa-link"></i> URL GOOGLE APPS SCRIPT (Web App URL):
      </label>
      <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec" 
        class="w-full text-xs p-2.5 border border-amber-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white">
      <p class="text-[11px] text-amber-700 mt-1">
        *Masukkan URL Web App dari Google Apps Script kamu di sini. URL akan tersimpan otomatis di browser.
      </p>
    </div>

    <form id="notaForm" onsubmit="event.preventDefault();">
      
      <!-- Informasi Nota Header -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-6">
        <h2 class="text-base font-bold text-slate-700 mb-4 pb-2 border-b border-slate-100 flex items-center gap-2">
          <i class="fa-solid fa-file-invoice text-indigo-600"></i> Informasi Nota
        </h2>
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">No. Nota / Faktur</label>
            <input type="text" id="noNota" required class="w-full text-sm p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Belanja</label>
            <input type="date" id="tglNota" required class="w-full text-sm p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Grosir / Supplier</label>
            <input type="text" id="supplier" placeholder="Contoh: Toko Grosir Jaya" required class="w-full text-sm p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Metode Pembayaran</label>
            <select id="metodeBayar" class="w-full text-sm p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
              <option value="Tunai">Tunai / Cash</option>
              <option value="Transfer">Transfer Bank</option>
              <option value="Tempo">Tempo / Hutang</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Detail Barang (Items) -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-6">
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
          <h2 class="text-base font-bold text-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-boxes-stacked text-indigo-600"></i> Daftar Barang Belanjaan
          </h2>
          <button type="button" onclick="tambahBarang()" class="no-print text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold px-3 py-2 rounded-lg flex items-center gap-1 transition">
            <i class="fa-solid fa-plus"></i> Tambah Barang
          </button>
        </div>

        <div id="containerBarang" class="space-y-4">
          <!-- Item baris barang akan muncul di sini via JavaScript -->
        </div>
      </div>

      <!-- Catatan & Ringkasan Total -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 md:col-span-2">
          <label class="block text-xs font-semibold text-slate-600 mb-1">Catatan Tambahan</label>
          <textarea id="catatan" rows="3" placeholder="Contoh: Barang kurang 1 pcs, janji diantar besok..." class="w-full text-sm p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>

        <div class="bg-indigo-900 text-white rounded-xl shadow-sm p-5 flex flex-col justify-between">
          <span class="text-xs text-indigo-200 font-semibold uppercase tracking-wider">Total Pembelian</span>
          <div class="text-3xl font-extrabold my-2" id="displayTotalPembelian">Rp 0</div>
          <span class="text-[11px] text-indigo-300">*Otomatis dihitung dari total seluruh barang</span>
        </div>
      </div>

      <!-- Tombol Aksi -->
      <div class="flex flex-wrap gap-3 justify-end no-print">
        <button type="button" onclick="resetForm()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-5 py-2.5 rounded-lg font-semibold text-sm transition
